services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-settlement-postgres
    environment:
      POSTGRES_DB: smart_settlement
      POSTGRES_USER: smart_settlement
      POSTGRES_PASSWORD: smart_settlement
    ports:
      - "5432:5432"
    volumes:
      - smart_settlement_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_settlement -d smart_settlement"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  smart_settlement_postgres_data:
